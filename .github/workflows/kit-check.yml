name: kit-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # update-check clones the checkout; git can't clone from a shallow repo
      - uses: astral-sh/setup-uv@v10.3.0   # no floating major tags since v8
        with:
          enable-cache: false   # only installs copier; nothing worth caching
      - run: uv tool install copier
      - name: kit-check with the private leak words
        env:
          LEAK_WORDS: ${{ secrets.LEAK_WORDS }}
        run: |
          printf '%s\n' "$LEAK_WORDS" > "$RUNNER_TEMP/leak.txt"
          tests/kit-check "$RUNNER_TEMP/leak.txt"
      - run: tests/update-check

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # update-check clones the checkout; git can't clone from a shallow repo
      - uses: astral-sh/setup-uv@v10.3.0   # no floating major tags since v8
        with:
          enable-cache: false   # only installs copier; nothing worth caching
      - run: uv tool install copier
      - run: tests/kit-check
