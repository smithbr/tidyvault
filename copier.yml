# tidyvault: Copier template for an Obsidian PARA/GTD vault run by agents.
# New vault:  copier copy --trust gh:smithbr/tidyvault <path>
# Update:     copier update --trust   (from the vault root)
# --trust lets Copier run _tasks (the first-time setup); updates need it once a vault came from a kit with tasks.
_min_copier_version: "9.6"  # _copier_operation, for the copy-only setup task
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_envops:
  # Wikilinks use [[...]] and Obsidian templates use {{...}}: kit markers must clash with neither.
  block_start_string: "[[%"
  block_end_string: "%]]"
  variable_start_string: "[[="
  variable_end_string: "=]]"
  comment_start_string: "[[!"
  comment_end_string: "!]]"
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

# Seeds: written once, then the vault's own. Agents/local/ is never touched by the kit.
_skip_if_exists:
  - Home.md
  - "People/*.md"
  - Agents/changelog.md
  - Agents/pii-allowlist.md
  - "Agents/local/**"
  - "Resources/**"
  - "Areas/**"
  # Obsidian settings: shipped once; Obsidian and the owner change them from then on.
  - ".obsidian/**"

# Module files are left out when their module is off.
_exclude:
  - copier.yml
  - "[[% if not backup %]].scripts/restic[[% endif %]]"
  - "[[% if not backup %]].scripts/restic/**[[% endif %]]"
  - "[[% if not (backup and store) %]].scripts/restic/store-*[[% endif %]]"
  - "[[% if not backup %]]Resources/vault-backup-and-restore.md*[[% endif %]]"
  - "[[% if not false_facts %]]Resources/false-facts.md*[[% endif %]]"
  - "[[% if not obsidian %]].obsidian[[% endif %]]"
  - "[[% if not obsidian %]].obsidian/**[[% endif %]]"
  - "[[% if not obsidian %]].scripts/obsidian-plugins[[% endif %]]"
  - "[[% if not obsidian %]]Agents/obsidian-settings.md*[[% endif %]]"
  - "[[% if not pii %]].scripts/pii-register-check*[[% endif %]]"
  - "[[% if not pii %]].scripts/pii-merge-queue*[[% endif %]]"
  - "[[% if not pii %]]Agents/sensitive-data.md*[[% endif %]]"
  - "[[% if not pii %]]Agents/pii-allowlist.md*[[% endif %]]"
  - "[[% if not pii %]]Resources/pii-register.md*[[% endif %]]"
  - "[[% if not store %]].scripts/store-image*[[% endif %]]"
  - "[[% if not store %]].scripts/store-move*[[% endif %]]"
  - "[[% if not store %]]Resources/file-store.md*[[% endif %]]"

owner_full:
  type: str
  help: Your full name ("Robin Vale")
  validator: "[[% if not owner_full.strip() %]]Enter a name.[[% elif owner_full | select('in', '\"\\\\:#`$') | list %]]Leave out quotes, backslashes, colons, #, backticks, and $.[[% endif %]]"
owner:
  type: str
  help: First name agents call you by in notes
  default: "[[= owner_full.split()[0] if owner_full.split() else '' =]]"
  validator: "[[% if not owner.strip() %]]Enter a name.[[% elif owner | select('in', '\"\\\\:#`$') | list %]]Leave out quotes, backslashes, colons, #, backticks, and $.[[% endif %]]"
owner_slug:
  type: str
  help: File name of your own note in People/ (Enter keeps the suggestion)
  # The vault-lint slugify (Agents/naming-and-style.md): accents folded, apostrophes and other non-ASCII dropped,
  # every other run of non-alphanumerics a hyphen.
  default: '[[% set ns = namespace(s=owner_full | lower) %]][[% for a, b in [("àáâãäåāăą","a"),("çćĉċč","c"),("ď","d"),("èéêëēĕėęě","e"),("ĝğġģ","g"),("ĥ","h"),("ìíîïĩīĭį","i"),("ĵ","j"),("ķ","k"),("ĺļľ","l"),("ñńņň","n"),("òóôõöōŏő","o"),("ŕŗř","r"),("śŝşšș","s"),("ţťț","t"),("ùúûüũūŭůűų","u"),("ŵ","w"),("ýÿŷ","y"),("źżž","z")] %]][[% for c in a %]][[% set ns.s = ns.s | replace(c, b) %]][[% endfor %]][[% endfor %]][[= ns.s | replace("''", "") | regex_replace("[^\x00-\x7f]", "") | regex_replace("[^a-z0-9]+", "-") | regex_replace("^-+|-+$", "") =]]'
  validator: "[[% if not owner_slug or owner_slug | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789-') | list or owner_slug[0] == '-' %]]Lowercase letters, digits, and hyphens for spaces (robin-vale).[[% endif %]]"
vault:
  type: str
  help: Vault name, short and lowercase; it also names the vault's 1Password items
  default: notes
  validator: "[[% if not vault or vault | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789-') | list or vault[0] == '-' %]]Lowercase letters, digits, and hyphens only (notes).[[% endif %]]"

store:
  type: bool
  help: Keep attachments (PDFs, images) in a folder outside the vault, linked in as _files?
  default: true
store_path:
  type: str
  help: That folder, as a ~ path, outside any synced folder
  default: "~/[[= vault =]]-files"
  when: "[[= store =]]"
  validator: "[[% if not store_path.startswith('~/') or store_path | length < 3 %]]Start the path with ~/ (~/notes-files).[[% elif store_path[2:] | reject('in', 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._-/') | list or '..' in store_path or '//' in store_path or store_path.endswith('/') %]]Letters, digits, and . _ - / only, no spaces, .., //, or trailing / (~/notes-files).[[% endif %]]"
pii:
  type: bool
  help: Keep personal details (account numbers, IDs, addresses) in 1Password, with notes holding only a key to each?
  default: true
false_facts:
  type: bool
  help: Keep a list of claims agents must never write, such as mistakes they made before?
  default: true
obsidian:
  type: bool
  help: Include Obsidian settings (.obsidian/, written once) and a plugin installer?
  default: true
backup:
  type: bool
  help: Back up the vault nightly to Backblaze B2 with restic? Needs a B2 account.
  default: false

_message_before_copy: |
  A few questions about you and the vault, then five optional parts. Enter accepts the suggested answer.

# A new vault sets itself up: plugins and git without asking, then a prompt per remaining step.
# Never fails the copy (Copier would delete the new folder); vault-setup reruns finish what's left.
_tasks:
  - command: python3 .scripts/vault-setup --new || true
    when: "[[= _copier_operation == 'copy' =]]"

_message_after_copy: |
  Vault ready.[[% if obsidian %]] Open the folder in Obsidian and choose "Trust author and enable plugins".[[% endif %]]

  Rerun python3 .scripts/vault-setup from the vault folder until every line says ok.
