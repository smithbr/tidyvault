# tidyvault: Copier template for an Obsidian PARA/GTD vault run by agents.
# New vault:  copier copy gh:smithbr/tidyvault <path>
# Update:     copier update   (from the vault root)
_min_copier_version: "9.4"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_envops:
  # Wikilinks use [[...]] and Obsidian templates use {{...}}: kit markers must clash with neither.
  block_start_string: "[[%"
  block_end_string: "%]]"
  variable_start_string: "[[="
  variable_end_string: "=]]"
  comment_start_string: "[[!"
  comment_end_string: "!]]"
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

# Seeds: written once, then the vault's own. Agents/local/ is never touched by the kit.
_skip_if_exists:
  - Home.md
  - "People/*.md"
  - Agents/changelog.md
  - Agents/pii-allowlist.md
  - "Agents/local/**"
  - "Resources/**"
  - "Areas/**"
  # Obsidian settings: shipped once; Obsidian and the owner change them from then on.
  - ".obsidian/**"

# Module files are left out when their module is off.
_exclude:
  - copier.yml
  - "[[% if not backup %]].scripts/restic[[% endif %]]"
  - "[[% if not backup %]].scripts/restic/**[[% endif %]]"
  - "[[% if not (backup and store) %]].scripts/restic/store-*[[% endif %]]"
  - "[[% if not backup %]]Resources/vault-backup-and-restore.md*[[% endif %]]"
  - "[[% if not false_facts %]]Resources/false-facts.md*[[% endif %]]"
  - "[[% if not obsidian %]].obsidian[[% endif %]]"
  - "[[% if not obsidian %]].obsidian/**[[% endif %]]"
  - "[[% if not obsidian %]].scripts/obsidian-plugins[[% endif %]]"
  - "[[% if not obsidian %]]Agents/obsidian-settings.md*[[% endif %]]"
  - "[[% if not pii %]].scripts/pii-register-check*[[% endif %]]"
  - "[[% if not pii %]].scripts/pii-merge-queue*[[% endif %]]"
  - "[[% if not pii %]]Agents/sensitive-data.md*[[% endif %]]"
  - "[[% if not pii %]]Agents/pii-allowlist.md*[[% endif %]]"
  - "[[% if not pii %]]Resources/pii-register.md*[[% endif %]]"
  - "[[% if not store %]].scripts/store-image*[[% endif %]]"
  - "[[% if not store %]].scripts/store-move*[[% endif %]]"
  - "[[% if not store %]]Resources/file-store.md*[[% endif %]]"

owner_full:
  type: str
  help: Your full name ("Robin Vale")
  validator: "[[% if not owner_full.strip() %]]Enter a name.[[% endif %]]"
owner:
  type: str
  help: First name agents call you by in notes
  default: "[[= owner_full.split()[0] if owner_full.split() else '' =]]"
  validator: "[[% if not owner.strip() %]]Enter a name.[[% endif %]]"
owner_slug:
  type: str
  help: File name of your own note in People/ (Enter keeps the suggestion)
  default: "[[= owner_full.strip() | lower | replace(' ', '-') =]]"
  validator: "[[% if not owner_slug or owner_slug != owner_slug | lower or ' ' in owner_slug or '/' in owner_slug %]]Lowercase, with hyphens for spaces (robin-vale).[[% endif %]]"
vault:
  type: str
  help: Vault name, short and lowercase; it also names the vault's 1Password items
  default: notes
  validator: "[[% if not vault or vault != vault | lower or ' ' in vault or '/' in vault %]]Lowercase, no spaces or slashes (notes).[[% endif %]]"

store:
  type: bool
  help: Keep attachments (PDFs, images) in a folder outside the vault, linked in as _files?
  default: true
store_path:
  type: str
  help: That folder, as a ~ path, outside any synced folder
  default: "~/[[= vault =]]-files"
  when: "[[= store =]]"
  validator: "[[% if not store_path.startswith('~/') %]]Start the path with ~/ (~/notes-files).[[% endif %]]"
pii:
  type: bool
  help: Keep personal details (account numbers, IDs, addresses) in 1Password, with notes holding only a key to each?
  default: true
false_facts:
  type: bool
  help: Keep a list of claims agents must never write, such as mistakes they made before?
  default: true
obsidian:
  type: bool
  help: Include Obsidian settings (.obsidian/, written once) and a plugin installer?
  default: true
backup:
  type: bool
  help: Back up the vault nightly to Backblaze B2 with restic? Needs a B2 account.
  default: false

_message_before_copy: |
  A few questions about you and the vault, then five optional parts. Enter accepts the suggested answer.

_message_after_copy: |
  Vault rendered. Next, from the vault folder:
  [[% if obsidian %]]
    - Open it in Obsidian, then: python3 .scripts/obsidian-plugins
  [[% endif %]]
    - python3 .scripts/vault-setup
      A walkthrough of what is left: git history[[% if pii %]], the 1Password CLI and the PII register document[[% endif %]][[% if backup %]], restic backups to Backblaze B2 with the password kept in 1Password[[% endif %]].
      It offers to do each step it can; rerun it until every line says ok.
